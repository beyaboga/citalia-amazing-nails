name: Supabase keep-alive

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Este workflow hace un par de peticiones ligeras a la API del proyecto cada
# 3 días para que siempre cuente como "activo".
#
# Requiere dos secrets en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              → https://<project-id>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY → la misma llave que está en .env

on:
  schedule:
    - cron: '0 14 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (REST + Storage)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          for path in rest/v1/ storage/v1/bucket; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$SUPABASE_URL/$path")
            echo "$path -> HTTP $code"
            if [ "$code" -ge 400 ]; then exit 1; fi
          done
